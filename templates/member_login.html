{% extends 'base.html' %}{% block title %}Member Login | The Workprint Project{% endblock %}{% block body %}<section class="shell member-panel"><div class="member-box"><div class="eyebrow">MEMBERS AREA</div><h1>Member sign in</h1><p class="muted">Log in to access your download allowance.</p><form method="post" class="member-form"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><input type="hidden" name="next" value="{{next_url}}"><label for="login">Username or email</label><input id="login" name="login" required autocomplete="username"><label for="pass">Password</label><input id="pass" type="password" name="password" required autocomplete="current-password"><button class="button primary full" type="submit">SIGN IN</button></form><p>Not a member? <a href="{{url_for('member_register')}}">Create a free account →</a></p></div></section>{% endblock %}
